name: Tipoinstalacion/Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  run-tests:
    if: |
      github.event_name == 'push' ||
      contains(github.event.pull_request.labels.*.name, 'to be merged')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # You can use PyPy versions in python-version.
      # For example, pypy2 and pypy3
      matrix:
        python-version: ["2.7", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      if: matrix.python-version != '2.7'
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run tests with Python 2.7
      if: matrix.python-version == '2.7'
      run: |
        docker run --rm -v "$PWD:/work" -w /work python:2.7 bash -lc "
          python -m pip install --upgrade 'pip<21' 'setuptools<45' wheel &&
          pip install -r requirements-dev.txt &&
          pip install -e . &&
          mamba
        "

    - name: Upgrade pip
      if: matrix.python-version != '2.7'
      run: |
        pip install --upgrade pip setuptools wheel

    - name: Install dependencies
      if: matrix.python-version != '2.7'
      run: |
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Run test
      if: matrix.python-version != '2.7'
      run: |
        mamba
